services:
  ittracks:
    build: .
    ports:
      # BIND_ADDRESS=127.0.0.1 in a .env file next to this one keeps the app on this computer
      # only, for a private server behind Tailscale (docs/private-server.md).
      - "${BIND_ADDRESS:-0.0.0.0}:3000:3000"
    volumes:
      - ./data:/data
      # Automatic backups on another drive: mount its folder, then set /backups in
      # Settings → Data → Automatic backups (docs/private-server.md#automatic-backups).
      # - /Volumes/Backup/ittracks:/backups
    environment:
      # The address you open the app at. Set ORIGIN in .env, or change the default here.
      ORIGIN: ${ORIGIN:-http://localhost:3000}
    restart: unless-stopped
